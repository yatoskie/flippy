<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Flippy</title>
<meta name="description" content="Manage your Flippy account, password, and theme.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="topnav">
  <a class="logo" href="index.html"><span class="mark"></span>Flippy</a>
  <div class="nav-search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Search your decks and cards" data-nav-search>
  </div>
  <div class="nav-right">
    <button class="icon-btn" data-game-btn title="Game mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="4"/><line x1="7" y1="12" x2="9" y2="12"/><line x1="8" y1="11" x2="8" y2="13"/><circle cx="16" cy="10.5" r=".8" fill="currentColor"/><circle cx="18" cy="12.5" r=".8" fill="currentColor"/></svg>
    </button>
    <div style="position:relative;">
      <button class="avatar" data-profile-trigger data-avatar-slot>?</button>
      <div class="popover" data-profile-popover>
        <button data-open-avatar-upload>Edit profile picture</button>
        <input type="file" accept="image/*" data-avatar-upload hidden>
        <button data-game-btn>Game — coming soon</button>
        <button data-logout>Log out</button>
      </div>
    </div>
  </div>
</header>

<div class="app-shell" style="grid-template-columns:220px 1fr;">
  <aside class="sidebar">
    <nav>
      <a href="dashboard.html">Home</a>
      <a href="cards.html">My Cards</a>
      <a href="settings.html" class="active">Settings</a>
      <button data-logout>Logout</button>
    </nav>
  </aside>

  <main class="main-col">
    <div class="page-head">
      <h1 style="font-size:1.6rem;">Settings</h1>
      <p>Update your account and how Flippy looks.</p>
    </div>

    <div class="settings-grid">

      <div class="settings-card">
        <h3>Profile</h3>
        <form id="profile-form">
          <div class="field">
            <label for="set-username">Username</label>
            <input id="set-username" required>
          </div>
          <div class="field">
            <label for="set-email">Email</label>
            <input id="set-email" type="email" required>
          </div>
          <div class="field">
            <label for="set-current-pw">Current password (required to save changes)</label>
            <input id="set-current-pw" type="password" required>
            <div class="msg error" id="profile-error" style="display:none;"></div>
          </div>
          <button class="btn btn-primary" type="submit">Save profile</button>
        </form>
      </div>

      <div class="settings-card">
        <h3>Change password</h3>
        <form id="password-form">
          <div class="field">
            <label for="pw-current">Current password</label>
            <input id="pw-current" type="password" required>
          </div>
          <div class="field">
            <label for="pw-new">New password</label>
            <input id="pw-new" type="password" required minlength="8">
          </div>
          <div class="field">
            <label for="pw-new2">Confirm new password</label>
            <input id="pw-new2" type="password" required>
            <div class="msg error" id="password-error" style="display:none;"></div>
          </div>
          <button class="btn btn-primary" type="submit">Update password</button>
        </form>
      </div>

      <div class="settings-card">
        <h3>Appearance</h3>
        <div class="theme-toggle">
          <button type="button" id="theme-light">Light</button>
          <button type="button" id="theme-dark">Dark</button>
        </div>
        <label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:8px;">Accent color</label>
        <div class="accent-row">
          <input type="color" id="accent-picker" value="#3B6FE0">
          <div class="accent-swatches">
            <button type="button" data-accent="#3B6FE0" style="background:#3B6FE0;"></button>
            <button type="button" data-accent="#2F9E6E" style="background:#2F9E6E;"></button>
            <button type="button" data-accent="#C2452F" style="background:#C2452F;"></button>
            <button type="button" data-accent="#9B5DE0" style="background:#9B5DE0;"></button>
            <button type="button" data-accent="#E0A62F" style="background:#E0A62F;"></button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="modal-overlay" id="flippy-generic-modal">
  <div class="modal">
    <h3 data-modal-title>Notice</h3>
    <p data-modal-body></p>
    <div class="modal-actions">
      <button class="btn btn-primary" data-modal-close>Got it</button>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/api-client.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
